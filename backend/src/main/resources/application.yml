spring:
  application:
    name: werewolf
  jackson:
    deserialization:
      fail-on-null-for-primitives: false
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:werewolf}
    username: ${POSTGRES_USER:werewolf}
    password: ${POSTGRES_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope: openid,profile,email

app:
  jwt:
    # No default — MUST be provided via env. Dev/e2e profiles supply their own.
    # Fail-fast on missing secret prevents accidental use of a hardcoded key in prod.
    secret: ${JWT_SECRET}
    expiration-hours: 24
  oauth:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      token-uri: https://oauth2.googleapis.com/token
      userinfo-uri: https://www.googleapis.com/oauth2/v3/userinfo
      # No localhost default — prod must set this explicitly. Dev profile supplies a localhost default.
      redirect-uri: ${GOOGLE_REDIRECT_URI}
    wechat:
      app-id: ${WECHAT_APP_ID:}
      app-secret: ${WECHAT_APP_SECRET:}
  cors:
    allowed-origins: "*"
  payment:
    # Payments switch; when true, blank Stripe keys or frontend-base-url fail startup
    enabled: ${PAYMENTS_ENABLED:false}
    # Required when enabled (the private host the Checkout redirects return to)
    frontend-base-url: ${FRONTEND_BASE_URL:}
    # Required when enabled (blank fails startup); test-mode keys until going live
    stripe-secret-key: ${STRIPE_SECRET_KEY:}
    stripe-webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    # Feature flag: lets the Stripe sandbox integration tests run (CI/local only)
    sandbox-tests-enabled: ${STRIPE_SANDBOX_TESTS_ENABLED:false}
    # Stripe's minimum is 30 min after creation; 31 leaves headroom for latency
    session-expiry-minutes: 31
    # How often unpaid orders are reconciled with Stripe (10 min)
    reconcile-interval-ms: 600000
    # First reconcile after startup (30 s), off the startup thread
    reconcile-initial-delay-ms: 30000
    # Only reconcile orders still CREATED after this long
    reconcile-min-age-minutes: 10
    # How far back the Stripe sweep looks for missed payments
    sweep-lookback-days: 30
    # Min seconds between Stripe status checks per order from the return page
    status-check-throttle-seconds: 5
    # Orders per page of the player's top-up history
    orders-page-size: 20
    # Self-service refund: days after payment a change-of-mind refund is possible
    self-refund-days: 14
    # ...and at most self-refund-max-per-window self refunds per account in this many days
    self-refund-window-days: 30
    self-refund-max-per-window: 1

server:
  port: 8080

# WebSocket configuration
websocket:
  allowed-origins: "*"

werewolf:
  host-timer:
    presets-seconds: [75, 180]
  # Game-end credit rewards (see RewardSettlementService)
  rewards:
    win-bonus: 20
    participation: 5
    wolf-per-day-survived: 4
    sheriff-bonus: 5
    wolf-vote-bonus: 3
  # Admin credit grants: 4-digit PIN from env; unset = grants disabled (503)
  admin:
    pin: ${ADMIN_PIN:}
  # Abandoned in-flight games (see AbandonedGameSweep)
  games:
    # Cancel a game after this long with no accepted action
    abandon-after-minutes: 120
    # How often to check (10 min)
    abandon-sweep-interval-ms: 600000
