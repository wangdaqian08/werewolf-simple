spring:
  application:
    name: werewolf
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:werewolf}
    username: ${POSTGRES_USER:werewolf}
    password: ${POSTGRES_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope: openid,profile,email

app:
  jwt:
    # No default — MUST be provided via env. Dev/e2e profiles supply their own.
    # Fail-fast on missing secret prevents accidental use of a hardcoded key in prod.
    secret: ${JWT_SECRET}
    expiration-hours: 24
  oauth:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      token-uri: https://oauth2.googleapis.com/token
      userinfo-uri: https://www.googleapis.com/oauth2/v3/userinfo
      # No localhost default — prod must set this explicitly. Dev profile supplies a localhost default.
      redirect-uri: ${GOOGLE_REDIRECT_URI}
    wechat:
      app-id: ${WECHAT_APP_ID:}
      app-secret: ${WECHAT_APP_SECRET:}
  cors:
    allowed-origins: "*"
  payment:
    frontend-base-url: ${FRONTEND_BASE_URL:https://www.youplay123.online}
    # Test-mode keys; empty default disables checkout (503) rather than failing boot
    stripe-secret-key: ${STRIPE_SECRET_KEY:}
    stripe-webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    # Feature flag: lets the Stripe sandbox integration tests run (CI/local only)
    sandbox-tests-enabled: ${STRIPE_SANDBOX_TESTS_ENABLED:false}

server:
  port: 8080

# WebSocket configuration
websocket:
  allowed-origins: "*"

# Game-end credit rewards (see RewardSettlementService)
werewolf:
  rewards:
    win-bonus: 20
    participation: 5
    wolf-per-day-survived: 4
