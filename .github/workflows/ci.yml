name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # ── Backend ───────────────────────────────────────────────────────────────────
  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: werewolf_test
          POSTGRES_USER: werewolf
          POSTGRES_PASSWORD: werewolf
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Run DB init script (mirrors docker/init.sql)
        run: psql -h localhost -U werewolf -d werewolf_test -f docker/init.sql
        env:
          PGPASSWORD: werewolf

      - uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: temurin

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('backend/**/*.gradle.kts', 'backend/gradle/libs.versions.toml', 'backend/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build & test
        run: ./gradlew build
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/werewolf_test
          SPRING_DATASOURCE_USERNAME: werewolf
          SPRING_DATASOURCE_PASSWORD: werewolf
          # Sandbox tests run only when the secret exists (fork PRs get no
          # secrets → flag stays false → StripeSandboxIntegrationTest skips cleanly).
          STRIPE_SANDBOX_TESTS_ENABLED: ${{ secrets.STRIPE_SANDBOX_SECRET != '' && 'true' || 'false' }}
          STRIPE_SANDBOX_SECRET: ${{ secrets.STRIPE_SANDBOX_SECRET }}

  # Built once, shared by every E2E · Integration shard (each one used to
  # compile the backend itself through `gradlew bootRun`).
  backend-jar:
    name: Backend Jar
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: temurin

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('backend/**/*.gradle.kts', 'backend/gradle/libs.versions.toml', 'backend/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build jar
        # bootJar alone leaves exactly one jar in build/libs; cp fails loudly otherwise.
        run: ./gradlew bootJar && cp build/libs/*.jar build/app.jar

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/build/app.jar
          retention-days: 1

  # ── Frontend ──────────────────────────────────────────────────────────────────
  checks:
    name: Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/frontend-deps

      - name: Format check (Prettier)
        run: npm run format:check

      - name: Lint (ESLint)
        run: npm run lint

      - name: No sleeps in E2E
        # waitForTimeout / setTimeout sleeps are banned in the Playwright
        # suites (CLAUDE.md "E2E tests: no fixed sleeps").
        run: npx eslint -c eslint.e2e-waits.config.js e2e

      - name: Type-check
        run: npx vue-tsc -b --noEmit

      - name: Unit tests with coverage
        run: npm run test:unit:coverage

  e2e-ui:
    # No shard-count denominator in the name: branch protection matches
    # required checks by EXACT name, so "(1/3)" style names break protection
    # every time the shard count changes (bit us on the 6→8 integration
    # rebalance). Update the required checks in Settings → Branches if these
    # names ever change again.
    name: E2E · UI (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/frontend-deps

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS dependencies (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: E2E tests (shard ${{ matrix.shard }}/3)
        run: npm run test:e2e:ui -- --shard=${{ matrix.shard }}/3

      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-ui-${{ matrix.shard }}
          path: frontend/blob-report/
          retention-days: 1

  merge-reports:
    name: Merge E2E Reports
    if: always()
    needs: e2e-ui
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/frontend-deps

      - name: Download blob reports
        uses: actions/download-artifact@v4
        with:
          pattern: blob-report-ui-*  # not blob-report-integration-*, which may already be uploaded
          path: frontend/blob-report
          merge-multiple: true

      - name: Merge reports
        run: npx playwright merge-reports --reporter html ./blob-report

      - name: Upload merged HTML report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # ── E2E Integration (real backend) ──────────────────────────────────────────
  #
  # Shard map is hand-curated by measured spec runtime. Re-balance whenever a
  # new spec lands or runtime drifts ≥30%.
  #
  # The biggest single spec — flow-12p-sheriff.spec.ts — has 2 long
  # independent describe blocks (CLASSIC + HARD_MODE) that each setupGame
  # their own 12p game. Cannot use Playwright's `workers: 2` to run them in
  # parallel within a shard because every spec's setupGame logs in as
  # nickname "Host", and parallel /api/user/login calls with the same
  # nickname race in AuthService.loginOrRegister (TOCTOU between findById
  # and the INSERT). Instead, drive parallelism via additional shards: each
  # describe block lives on its own shard, selected via Playwright `--grep`.
  # That keeps `workers: 1` everywhere and avoids touching the 30+ specs
  # that depend on the literal "Host" nickname.
  #
  # Idiot-flow moved off shard 4 (was the new long pole at ~6m46s after the
  # 5-shard rebalance) onto shard 4 still, kept revote + d1-outcomes there;
  # the heavier mix lands inside the same wall-clock budget as shard 5/6.
  #
  #   Last measurement (run on PR #98, 2026-05-05) — 5-shard layout:
  #     shard 1 (flow-12p-sheriff)             7m24s ← long pole
  #     shard 2 (game-flow + sheriff-flow)     3m30s
  #     shard 3 (revote + idiot + d1-outcomes) 6m29s
  #     shard 4 (dead-role + werewolf + full)  5m22s
  #     shard 5 (audio + login + guard)        4m15s
  #
  #   Per-spec runtime (from blob reports):
  #     flow-12p-sheriff CLASSIC          ~200s
  #     flow-12p-sheriff HARD_MODE        ~143s
  #     game-flow.spec.ts (10 seq)        ~145s
  #     game-flow-d1-outcomes.spec.ts      ~80s
  #     sheriff-flow.spec.ts              ~100s  (mostly setupGame)
  #     revote-flow.spec.ts                ~98s
  #     werewolf-win.spec.ts               ~91s
  #     witch-audio.spec.ts                ~80s
  #     dead-role-audio.spec.ts            ~74s
  #     idiot-flow.spec.ts                 ~70s
  #     audio-reconnect-recovery.spec.ts   ~45s
  #     full-game-audio.spec.ts            ~42s
  #     bgm-flow.spec.ts                   ~40s
  #     login.spec.ts                      ~10s
  #     guard-audio-sequence.spec.ts       ~85s  (runs on shard 6 — an older
  #                                               note wrongly said "skipped")
  #
  #   2026-07-07 additions (local measurements, CI ≈ 2×):
  #     flow-5night-hardmode.spec.ts      ~330s  ← new long pole, own shard 7
  #     flow-12p-sheriff night-killed      ~150s  (was in NO shard before —
  #                                               shards 1+2 grep only
  #                                               CLASSIC/HARD_MODE)
  #     witch-selfsave-blocked-flow.spec.ts ~35s  (one night + one reveal)
  #
  #   2026-11-05 rebalance (CI blob reports of run 41829631212, test time
  #   only; each job adds ~2.5-4 min of gradle/npm/browser setup):
  #     old long pole: shard 3 (game-flow + sheriff + both kings) 517 s → 12m32s.
  #     black-wolf-king-scenarios 415 s and night-rules-flow 387 s are each
  #     split in two by --grep on their test titles; every shard now carries
  #     ≤ ~340 s, the floor set by flow-5night-hardmode (341 s) running alone.
  #     hunter-night-death-flow + reconnect-rejoin were in NO shard (never ran
  #     in CI); mech-wolf-rules-flow is new. Per spec (s): black-wolf-king 415
  #     (happy/vote-out 176, night chain/edge/create 240), night-rules 387
  #     (repeated/dead seer/history 245, 空刀/self-save/空守 141), 5night 341,
  #     flow-12p 254 (CLASSIC 101, HARD 106, night-killed 47), sheriff-hunter
  #     185, revote 131, win-rules 111, werewolf-win 107, d1-outcomes 84,
  #     host-declare-out 80, idiot 76, self-destruct-rules 74, game-flow 69,
  #     dead-role 69, mech-medium 60, api-guards 50, the rest ≤ 40 each.
  #
  #   2026-11-14 rebalance (max of 3 main runs, test time + ~3.5 s per test):
  #     shard 11 was the long pole (36 tests, 411-502 s step). Its specs are
  #     spread over shards 2-6 and 8-11 so each lands ≤ ~330 s, under shard 1.
  #     revote-flow swings 149-249 s, so it sits on shard 8 with small specs.
  #   A grep applies to every spec on its shard, so a shard that greps lists
  #   the describe/test titles of ALL its specs — rename one, update it here.
  #   A whole spec joins a grep shard by its file name ('dead-role-audio.spec'):
  #   Playwright greps "file › describe › test".
  #   full-game-audio counts backend log lines from line 0, so it must stay the
  #   first spec (alphabetically) on its shard.
  e2e-integration:
    # Denominator-free for the same reason as the UI shards (see above).
    name: E2E · Integration (${{ matrix.shard.id }})
    runs-on: ubuntu-latest
    # Only the jar, not the backend test suite: the two run in parallel.
    needs: backend-jar
    strategy:
      fail-fast: false
      matrix:
        shard:
          # Shard 1: the 5-night HARD_MODE spine — the longest single spec,
          # runs alone. Pre-agreed fallback: demote to a nightly workflow
          # (payment-e2e.yml pattern) if p95 exceeds 15m or it flakes >1/20.
          - id: 1
            specs: e2e/real/flow-5night-hardmode.spec.ts
            grep: ''
          # Shards 2 + 3 split black-wolf-king-scenarios by test-title prefix
          # ('happy:' / 'vote-out…' vs 'night chain:' / 'edge:' / 'create room:').
          # Playwright greps the whole title path (file › describe › test), so
          # the terms are unanchored and must not occur in a describe title.
          - id: 2
            specs: e2e/real/black-wolf-king-scenarios.spec.ts e2e/real/mech-wolf-medium-flow.spec.ts e2e/real/api-guards-flow.spec.ts e2e/real/host-countdown.spec.ts
            grep: 'happy: knifed|vote-out|Mechanical wolf and medium|API guards|host-countdown.spec'
          - id: 3
            specs: e2e/real/black-wolf-king-scenarios.spec.ts e2e/real/pk-revote-flow.spec.ts e2e/real/dead-role-audio.spec.ts
            grep: 'night chain:|edge:|create room:|PK re-vote|dead-role-audio.spec'
          # Shards 4 + 5 split night-rules-flow by words unique to each test
          # title (its describe title repeats most of the topic words).
          - id: 4
            specs: e2e/real/night-rules-flow.spec.ts e2e/real/full-game-audio.spec.ts
            grep: 'keeps her turn|查驗結果|holds the antidote|full-game-audio.spec'
          - id: 5
            specs: e2e/real/night-rules-flow.spec.ts e2e/real/win-rules-flow.spec.ts e2e/real/guard-audio-sequence.spec.ts
            grep: 'sees no victim|cannot save herself|protects no one|no skip button|Win rules|guard-audio-sequence.spec'
          # Shards 6 + 7 split flow-12p-sheriff by describe title.
          - id: 6
            specs: e2e/real/flow-12p-sheriff.spec.ts e2e/real/werewolf-win.spec.ts e2e/real/audio-reconnect-recovery.spec.ts e2e/real/game-tasks-flow.spec.ts
            grep: 'HARD_MODE wolf win|night-killed sheriff|Werewolf win|Audio reconnect recovery|game-tasks-flow.spec'
          - id: 7
            specs: e2e/real/flow-12p-sheriff.spec.ts e2e/real/sheriff-hunter-rules-flow.spec.ts
            grep: 'CLASSIC villager win|Sheriff \+ hunter rules'
          - id: 8
            specs: e2e/real/revote-flow.spec.ts e2e/real/room-ready-sync.spec.ts e2e/real/white-wolf-king-flow.spec.ts e2e/real/reconnect-rejoin.spec.ts
            grep: ''
          - id: 9
            specs: e2e/real/mech-wolf-rules-flow.spec.ts e2e/real/game-flow.spec.ts e2e/real/sheriff-flow.spec.ts e2e/real/room-board.spec.ts
            grep: ''
          - id: 10
            specs: e2e/real/game-flow-d1-outcomes.spec.ts e2e/real/host-declare-out-flow.spec.ts e2e/real/idiot-flow.spec.ts e2e/real/self-destruct-rules-flow.spec.ts
            grep: ''
          - id: 11
            specs: e2e/real/gravekeeper-flow.spec.ts e2e/real/knight-flow.spec.ts e2e/real/witch-audio.spec.ts e2e/real/hunter-night-death-flow.spec.ts e2e/real/login.spec.ts e2e/real/ghost-member.spec.ts e2e/real/self-destruct-flow.spec.ts e2e/real/session-expiry-resume.spec.ts e2e/real/witch-selfsave-blocked-flow.spec.ts e2e/real/role-pick-card.spec.ts e2e/real/guard-witch-same-target-flow.spec.ts
            grep: ''

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: temurin

      - name: Download backend jar
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: backend/build

      - uses: ./.github/actions/frontend-deps

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Install Playwright OS dependencies (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
        working-directory: frontend

      - name: E2E integration tests (shard ${{ matrix.shard.id }})
        env:
          SPECS: ${{ matrix.shard.specs }}
          GREP: ${{ matrix.shard.grep }}
          E2E_BACKEND_JAR: ${{ github.workspace }}/backend/build/app.jar
        run: |
          if [ -n "$GREP" ]; then
            npx playwright test --config=playwright.real.config.ts $SPECS --grep="$GREP"
          else
            npx playwright test --config=playwright.real.config.ts $SPECS
          fi
        working-directory: frontend

      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-integration-${{ matrix.shard.id }}
          path: frontend/blob-report/
          retention-days: 1

      - name: Upload HTML report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-integration-${{ matrix.shard.id }}
          path: frontend/playwright-report/
          retention-days: 7

  merge-reports-integration:
    name: Merge Integration E2E Reports
    # Not when the shards were skipped (jar build failed): there is nothing to merge.
    if: always() && needs.e2e-integration.result != 'skipped'
    needs: e2e-integration
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Every real spec is in the shard matrix
        # A spec missing from the matrix above silently never runs in CI
        # (hunter-night-death-flow and reconnect-rejoin sat unlisted for
        # months). LOCAL-ONLY specs opt out by name here.
        run: |
          missing=0
          for f in e2e/real/*.spec.ts; do
            b=$(basename "$f")
            case "$b" in
              audio-autoplay-unlock.spec.ts|audio-autoplay-unlock-firefox.spec.ts) continue ;;
            esac
            if ! grep -q "e2e/real/$b" ../.github/workflows/ci.yml; then
              echo "::error::$b is not in the e2e-integration shard matrix (.github/workflows/ci.yml)"
              missing=1
            fi
          done
          exit $missing

      - uses: ./.github/actions/frontend-deps

      - name: Download blob reports
        uses: actions/download-artifact@v4
        with:
          pattern: blob-report-integration-*
          path: frontend/blob-report
          merge-multiple: true

      - name: Merge reports
        run: npx playwright merge-reports --reporter html ./blob-report

      - name: Upload merged HTML report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-integration-merged
          path: frontend/playwright-report/
          retention-days: 7
